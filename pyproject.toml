[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# The name is written by the generator from sdk.json (python.package).
name = "leto-domain-api"
dynamic = ["version"]
description = "Python client for the LETO Domain API (domain registration, DNS, transfers and more for LETO partners)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Feather IT Inc." }]
keywords = ["leto", "domain", "registrar", "reseller", "dns", "api", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "typing-extensions>=4.7",
]

[project.urls]
Homepage = "https://partners.leto.kr/docs"
Documentation = "https://partners.leto.kr/docs"
Changelog = "https://github.com/Feather-IT/leto-domain-sdk-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
# version.py is generated from sdk.json (python.version).
path = "src/leto_domain_api/version.py"
pattern = 'SDK = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/leto_domain_api"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "examples/",
    "README.md",
    "CHANGELOG.md",
    "OPERATIONS.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The sandbox smoke test calls the real API; it runs only with `pytest -m smoke` (make python-smoke).
addopts = "-m 'not smoke' --strict-markers"
markers = ["smoke: read-only calls against the real API with LETO_SDK_SANDBOX_KEY"]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "examples"]
warn_unreachable = true

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PT", "RET"]

[tool.ruff.lint.isort]
known-first-party = ["leto_domain_api"]
